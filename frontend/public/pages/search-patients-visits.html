<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Visitas - Agente Comunitário</title>
    <link rel="stylesheet" href="../assets/css/output.css">
    <script src="../assets/js/search-patients-visits.js" defer></script> 
</head>
<body class="w-screen h-screen flex flex-col">

    <header class="flex items-center bg-[var(--color-secondary)] h-20 px-4">
        <img class="h-16 w-16 mr-4" src="../assets/img/Logo.svg" alt="Logo" />
        <h1 class="text-xl lg:text-3xl font-sans text-[var(--color-fifth)]">Página de Visitas</h1>
    </header>

    <main class="flex flex-1">  
        
        <section class="flex flex-col flex-1 items-center px-4 md:px-10 lg:px-20 xl:px-30 py-6 overflow-auto">

            <h2 class="text-3xl lg:text-4xl xl:text-5xl font-bold m-3 xl:m-12 text-center text-gray-800">Pesquisar Visita Pendente</h2>
            <div class="flex flex-row mx-auto bg-[#D9D9D9] rounded-full w-full max-w-4xl h-12 xl:h-15 shadow-sm ">
                <input class="pl-6 text-lg xl:text-xl w-full h-full bg-transparent outline-none focus:ring-0" type="text" name="nome" id="searchInput" autocomplete="off" placeholder="Digite o nome do paciente ou CPF"/>
                <button type="submit" id="searchButton" class="flex items-center justify-center h-10%  w-16 xl:w-20 cursor-pointer text-gray-500 hover:text-[var(--color-primary)]">
                    <img src="../assets/img/search.svg" alt="Buscar" class="h-full w-full"/>
                </button>
            </div>
            
            <div class="flex flex-col w-full h-full mt-6 rounded-t-2xl bg-[#F0EBF6] p-6">
                <div id="cardsContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5 w-full justify-items-center"> 
                </div>
            </div>
        </section>
        
        <aside class="hidden lg:flex w-20 h-full bg-[var(--color-secondary)]"></aside>
    </main>

     
</body>
</html>
