<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Inicial - Agente Comunitário</title>
    <link rel="stylesheet" href="../assets/css/output.css">
</head>
<body class="w-screen h-screen flex flex-col">
    <!-- Header -->
    <header class="flex items-center bg-[var(--color-secondary)] h-20 px-4">
        <img class="h-18 w-18 mr-4" src="../assets/img/Logo.svg" alt="Logo" />
        <h1 class="lg:text-3xl font-sans text-[var(--color-fifth)]">Página de Visitas</h1>
    </header>
    <!-- Main Content -->
    <main class="flex flex-1">  
        <!--  -->
        <section class="flex flex-col flex-1 items-center px-30">
            <h2 class="xl:text-5xl text-2xl font-bold m-3 xl:m-12">Pesquisar Visita Pendente</h2>
            <div class="flex flex-row mx-10 bg-[#D9D9D9] rounded-full w-full h-10 xl:h-15">
                <input class="autofill:bg-[#D9D9D9] pl-5 outline-none focus:ring-0 text-2xl w-full h-full" type="text" name="nome" id="nome" autocomplete="off" placeholder="Digite o nome do paciente ou CPF"/>
                <button type="submit" class="flex items-center justify-center xl:h-15 xl:w-15 mr-4 bg-transparent border-none p-0 cursor-pointer">
                    <img src="../assets/img/search.svg" alt="Buscar" class="h-full w-full"/>
                </button>
            </div>
            <div class="flex flex-col w-full h-full mt-6 rounded-t-2xl bg-[#F0EBF6]">
                <div id="cardsContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                   
                </div>
            </div>
        </section>
        <div class="hidden lg:flex w-20 h-full bg-[var(--color-secondary)]"></div>
    </main>
</body>
</html>
