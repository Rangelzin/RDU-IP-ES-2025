<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Central Administrativa - Sistema de Rastreamento</title>
  <link href="../assets/css/output.css" rel="stylesheet" />
</head>
<body class="w-screen h-screen flex flex-col">

  <!-- Header -->
  <header class="flex items-center bg-[var(--color-secondary)] h-20 px-4">
    <img class="h-18 w-18 mr-4" src="../assets/img/Logo.svg" alt="Logo" />
    <h1 class="text-3xl font-sans text-[var(--color-fifth)]">Central Administrativa</h1>
  </header>

  <!-- Main Content -->
  <main class="flex flex-1">
 <div class="mx-auto my-auto flex flex-col gap-20 lg:gap-32 lg:flex-row mb-20"></div>
    <!-- Conteúdo do Admin -->
    <section class="flex flex-col flex-1 p-6">
      <h2 class="text-2xl font-bold text-[var(--color-tertiary)] mb-6">Funções Administrativas</h2>

      <!-- Linha 1 -->
      <div class="mx-auto my-auto flex flex-col gap-20 lg:gap-32 lg:flex-row mb-20">
        <!-- Card 1 - Paciente -->
        <div class="w-60 h-35 lg:w-75 lg:h-50 bg-[var(--color-quaternary)] rounded-xl hover:bg-[#bfb0d1] cursor-pointer">
          <div class="h-10 lg:h-12 bg-[var(--color-tertiary)] rounded-t-xl">
            <h3 class="text-xl pt-3 pl-5 font-semibold text-[var(--color-fifth)]">Paciente</h3>
          </div>
          <img class="h-15 w-15 lg:h-25 lg:w-25 mt-4 mx-auto" src="../assets/img/woman2.svg" alt="Paciente">
          <p class="text-center text-sm mt-2 font-semibold text-[var(--color-primary)]">Visualizar, adicionar e excluir pacientes</p>
        </div>

        <!-- Card 2 - Dashboard -->
        <div class="w-60 h-35 lg:w-75 lg:h-50 bg-[var(--color-quaternary)] rounded-xl hover:bg-[#bfb0d1] cursor-pointer">
          <div class="h-10 lg:h-12 bg-[var(--color-tertiary)] rounded-t-xl">
            <h3 class="text-xl pt-3 pl-5 font-semibold text-[var(--color-fifth)]">Dashboard Admin</h3>
          </div>
          <img class="h-15 w-15 lg:h-25 lg:w-25 mt-4 mx-auto" src="../assets/img/tabela.svg" alt="Dashboard">
          <p class="text-center text-sm mt-2 font-semibold text-[var(--color-primary)]">Visualizar estatísticas e relatórios</p>
        </div>
      </div>

      <!-- Linha 2 -->
      <div class="mx-auto flex flex-col gap-20 lg:gap-32 lg:flex-row">
        <!-- Card 3 - Usuário -->
        <div class="w-60 h-35 lg:w-75 lg:h-50 bg-[var(--color-quaternary)] rounded-xl hover:bg-[#bfb0d1] cursor-pointer">
          <div class="h-10 lg:h-12 bg-[var(--color-tertiary)] rounded-t-xl">
            <h3 class="text-xl pt-3 pl-5 font-semibold text-[var(--color-fifth)]">Usuário</h3>
          </div>
          <img class="h-15 w-15 lg:h-25 lg:w-20 mt-4 mx-auto" src="../assets/img/Magnifyingglass.svg" alt="Usuário">
          <p class="text-center text-sm mt-2 font-semibold text-[var(--color-primary)]">Visualizar, adicionar e excluir usuários</p>
        </div>

        <!-- Card 4 - Cadastrar Usuário -->
        <div class="w-60 h-35 lg:w-75 lg:h-50 bg-[var(--color-quaternary)] rounded-xl hover:bg-[#bfb0d1] cursor-pointer">
          <div class="h-10 lg:h-12 bg-[var(--color-tertiary)] rounded-t-xl">
            <h3 class="text-xl pt-3 pl-5 font-semibold text-[var(--color-fifth)]">Cadastrar</h3>
          </div>
          <img class="h-15 w-15 lg:h-25 lg:w-20 mt-4 mx-auto" src="../assets/img/adição.svg" alt="Cadastrar">
          <p class="text-center text-sm mt-2 font-semibold text-[var(--color-primary)]">Criar Novo Usuário</p>
        </div>
      </div>

      <div class="mt-10 text-center text-sm text-gray-500">© 2025 Aplicativo de Saúde. Todos os direitos reservados.</div>
    </section>

  </main>

</body>
</html>
