<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Sistema de rastreamento</title>
  <link href="/assets/css/output.css" rel="stylesheet" />
  <script src="/environment/environment.js"></script>
  <script src="/src/utils/noAuthBlockRoutes.js"></script>
  <script type="module" src="/assets/js/login.js"></script>
</head>
<body>
  <main class="bg-black h-screen flex flex-col xl:flex-row">
    <div class="flex flex-col md:flex-row items-center justify-center h-32 md:h-48 lg:h-60 w-screen lg:w-screen xl:w-1/2 xl:h-screen bg-(--color-primary)">
      <div class="flex flex-col items-center justify-center">
        <img class="h-25 w-25 md:h-40 md:w-40 xl:h-90 xl:w-90 2xl:h-110 2xl:w-110" src="/assets/img/Logo.svg" alt="" />
      </div>
    </div>
    <div class="flex items-center justify-center h-screen w-screen xl:w-1/2 bg-(--color-quaternary)">
      <div class="h-125 w-90 lg:h-135 md:w-120 lg:w-130 bg-(--color-fifth) shadow-[0_0px_40px_rgba(0,0,0,0.10)] lg:shadow-[0_0px_40px_rgba(0,0,0,0.25)] transition-all duration-500 ease rounded-2xl">
        <div class="flex mt-5 flex-col items-center justify-center">
          <img class="h-34 w-34 lg:h-38 lg:w-38" src="/assets/img/Woman.svg" alt="" />
          <h1 class="mt-3 lg:mt-5 font-extrabold text-3xl md:text-4xl text-(--color-primary)">Login</h1>
        </div>
        <form id="login-form" metho="POST" class="mx-5 md:mx-10 xl:mx-15">
          <div class="mt-3 lg:mt-5">
            <label for="login" class="px-3 text-start font-extrabold text-sm text-(--color-tertiary)">CPF</label>
            <div class="flex items-center justify-between bg-[#D9D9D9] rounded-2xl">
              <img src="/assets/img/person.svg" alt="" class="p-1 h-10 md:h-12" />
              <input type="text" name="login" id="login" class="w-full text-xl placeholder:text-lg py-3 outline-none focus:ring-0" placeholder="Digite seu Login" required />
            </div>
          </div>
          <div class="mt-3 lg:mt-5">
            <label for="senha" class="px-3 text-start font-extrabold text-sm text-(--color-tertiary)">Senha</label>
            <div class="flex items-center justify-between bg-[#D9D9D9] rounded-2xl">
              <img src="/assets/img/lock.svg" alt="" class="p-1 h-10 md:h-12" />
              <input type="password" name="senha" id="senha" class="w-full text-xl placeholder:text-lg py-3 outline-none focus:ring-0" placeholder="Digite sua Senha" required />
              <img onclick="togglePasswordVisibility()" src="/assets/img/visualizarSenha.svg" alt="" class="pr-2 h-8 cursor-pointer" />
            </div>
          </div>
          <button name="submit" id="submit" class="mt-6 text-white font-extrabold w-full text-xl py-3 bg-(--color-primary) rounded-2xl hover:bg-(--color-secondary) cursor-pointer">Acessar</button>
        </form>
      </div>
    </div>
  </main>
  <script>
    const togglePasswordVisibility = () => {
      const passwordInput = document.getElementById('senha');
      const passwordIcon = document.querySelector('.pr-2');
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        passwordIcon.src = '/assets/img/naoVisualizarSenha.svg';
      } else {
        passwordInput.type = 'password';
        passwordIcon.src = '/assets/img/visualizarSenha.svg';
      }
    }
  </script>
</body>
</html>
