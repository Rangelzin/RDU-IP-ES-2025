<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExamStatus</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="/assets/css/output.css" rel="stylesheet" />
    <script src="/src/utils/auth.js"></script>
</head>
<body class="font-sans bg-white text-text-dark leading-normal">
    <div class="flex flex-col min-h-screen">

        <main class="flex-grow p-6 bg-white md:p-10">
            <div class="max-w-7xl mx-auto">
                <div class="bg-container-bg-color border border-[var(--color-secondary)] rounded-xl p-6">
                    <div class="flex flex-col space-y-3">

                        <div class="relative bg-[var(--color-quaternary)] rounded-lg border border-[var(--color-secondary)] shadow-sm text-[var(--color-secondary)] overflow-hidden">
                            <div class="flex items-center space-x-2 p-2 px-4 border-b border-[--color-secondary]/40">
                                <i class="fas fa-file-alt text-[var(--color-secondary)] text-sm"></i>
                                <h2 class="font-semibold text-sm text-[--color-secondary]">Resultado do exame</h2>
                                <span class="absolute top-2 right-4 px-2 py-0.5 text-xs font-bold rounded-full border uppercase
                                             bg-status-available-bg text-status-available-text border-status-available-text">
                                    Finalizado
                                </span>
                            </div>
                            <div class="p-3 px-4">
                                <div class="grid grid-cols-1 gap-3 mb-3 md:grid-cols-3">
                                    <div class="item-info">
                                        <p class="text-xs text-[var(--color-secondary)] font-medium opacity-90 uppercase">Nº de Protocolo</p>
                                        <p class="font-semibold text-sm text-[--color-secondary]">0123456789</p>
                                    </div>
                                    <div class="item-info">
                                        <p class="text-xs text-[var(--color-secondary)] font-medium opacity-90 uppercase">Data de Entrada</p>
                                        <p class="font-semibold text-sm text-[--color-secondary]">05/02/2025</p>
                                    </div>
                                    <div class="item-info">
                                        <p class="text-xs text-[var(--color-secondary)] font-medium opacity-90 uppercase">Nome da Paciente</p>
                                        <p class="font-semibold text-sm text-[--color-secondary]">Dr(a) Médico da Silva</p>
                                    </div>
                                </div>
                                <div class="flex justify-end items-center space-x-4 pt-2 border-t border-dashed border-[--color-secondary]/40">
                                    <a href="#" class="text-sm font-semibold text-[var(--color-secondary)] no-underline transition-opacity duration-200 flex items-center space-x-1 hover:opacity-70 hover:underline">
                                        <i class="fas fa-eye">  </i> Ir para a ficha
                                    </a>
                                </div>
                            </div>
                        </div>

                     
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
