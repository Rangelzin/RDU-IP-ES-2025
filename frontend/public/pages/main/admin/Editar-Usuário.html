<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Editar Usuário</title>
  <link href="../../../assets/css/output.css" rel="stylesheet"/>
  
</head>
<body class="bg-[var(--color-fifth)] min-h-screen flex items-center justify-center p-4">
  <div class="bg-white shadow-[0_0px_40px_rgba(0,0,0,0.10)] lg:shadow-[0_0px_40px_rgba(0,0,0,0.25)] transition-all duration-500 ease rounded-2xl w-full max-w-4xl p-6 space-y-4">
    <div class="flex items-center justify-between">
      <h1 class="text-xl md:text-2xl font-bold text-gray-800">Administrativo - editar usuário</h1>
      <a href="#" class="text-sm text-pink-600 font-semibold hover:underline">&larr; Voltar</a>
    </div>

    <form id="formEditarUsuario" class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div class="bg-gray-100 p-4 rounded-xl shadow-inner space-y-3">
        <div>
          <label class="block text-sm font-semibold">Nome:</label>
          <input type="text" name="nome" value="DR. Vincent Vega" class="w-full px-3 py-2 rounded-md border border-gray-300" />
        </div>
        <div>
            
          <label class="block text-sm font-semibold">Profissão:</label>
          <input type="text" name="profissao" value="Ginecologista" class="w-full px-3 py-2 rounded-md border border-gray-300" />
        </div>
        <div>
          <label class="block text-sm font-semibold">E-mail:</label>
          <input type="email" name="email" value="vincentvega@gmail.com" class="w-full px-3 py-2 rounded-md border border-gray-300" />
        </div>
        <div>
          <label class="block text-sm font-semibold">Status:</label>
          <select name="status" class="w-full px-3 py-2 rounded-md border border-gray-300">
            <option value="Ativo" selected>Ativo</option>
            <option value="Inativo">Inativo</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-semibold">Telefone:</label>
          <input type="text" name="telefone" value="(11) 99876-5432" class="w-full px-3 py-2 rounded-md border border-gray-300" />
        </div>
        <h1  class="text-xl md:text-3xl font-bold text-gray-800 " >Permissões de acesso:</h1>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          
        <label class="flex items-center gap-2">
          <input type="checkbox" name="permissoes" value="relatorios" checked class="accent-green-600 w-5 h-5" />
          <span>Gerar Relatórios</span>
        </label>
        <label class="flex items-center gap-2">
          <input type="checkbox" name="permissoes" value="pacientes" checked class="accent-green-600 w-5 h-5" />
          <span>Gerenciar Pacientes</span>
        </label>
        <label class="flex items-center gap-2">
          <input type="checkbox" name="permissoes" value="agendamentos" checked class="accent-green-600 w-5 h-5" />
          <span>Gerenciar Agendamentos</span>
        </label>
        <label class="flex items-center gap-2">
          <input type="checkbox" name="permissoes" value="prontuarios" checked class="accent-green-600 w-5 h-5" />
          <span>Acessar Prontuários</span>
        </label>
        <label class="flex items-center gap-2">
          <input type="checkbox" name="permissoes" value="sistema" class="accent-green-600 w-5 h-5" />
          <span>Configurações do Sistema</span>
        </label>
      </div>

      <div class="md:col-span-2 pt-4 space-y-2">
        <h2 class="font-bold text-lg text-gray-800">Alterar Senha:</h2>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <input type="password" name="novaSenha" placeholder="Nova senha (opcional)" class="px-4 py-2 rounded-md border border-gray-300" />
          <input type="password" name="confirmarSenha" placeholder="Confirmar senha" class="px-4 py-2 rounded-md border border-gray-300" />
        </div>
      </div>

      <div class="md:col-span-2 flex justify-end gap-4 pt-4">
        <button type="button" class="bg-red-500 hover:bg-red-600 text-white font-semibold py-2 px-4 rounded-lg">Cancelar</button>
        <button type="submit" class="bg-purple-600 hover:bg-purple-700 text-white font-semibold py-2 px-4 rounded-lg">Salvar Alterações</button>
      </div>
    </form>
  </div>
</body>
</html>
