<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Página Inicial - Sistema de Rastreamento (Backend Simulado)</title>
  <link href="../assets/css/output.css" rel="stylesheet" />
</head>
<body class="w-screen h-screen flex flex-col">

  <header class="flex items-center bg-[var(--color-secondary)] h-20 px-4">
    <img class="h-18 w-18 mr-4" src="../assets/img/Logo.svg" alt="Logo" />
    <h1 class="text-3xl font-sans text-[var(--color-fifth)]">Administrativo - Gerenciar Usuário</h1>
  </header>

  <main class="flex flex-1">

    <aside class="w-20 bg-[var(--color-secondary)]"></aside>

    <section class="flex-1 bg-gray-100 p-6 overflow-auto">

      <div class="flex flex-wrap items-center gap-4 mb-6">
        <select id="filtroStatus" class="bg-white border border-gray-300 text-sm rounded px-3 py-2">
          <option value="todos">Todos os Status</option>
          <option value="ativo">Ativo</option>
          <option value="inativo">Inativo</option>
        </select>

        <select id="filtroCargo" class="bg-white border border-gray-300 text-sm rounded px-3 py-2">
          <option value="todos">Todos os cargos</option>
          <option value="médico">Médico</option>
          <option value="enfermeiro">Enfermeiro</option>
          <option value="agente comunitário">Agente Comunitário</option>
        </select>

        <input type="text" id="buscaNome" placeholder="Buscar por nome..." class="bg-white border border-gray-300 text-sm rounded px-3 py-2 w-60" />

         <button id="btnNovoUsuario" class="bg-purple-600 hover:bg-purple-700 text-white px-5 py-2.5 rounded-lg text-sm font-semibold shadow-md ml-auto transition duration-300 ease-in-out transform hover:scale-105">

        + Novo Usuário
    </button>
      </div>

      <div class="bg-white rounded-md overflow-hidden shadow">
        <div class="overflow-x-auto">
          <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-800">
              <tr>
                <th scope="col" class="px-6 py-4 text-left text-sm font-semibold text-white uppercase tracking-wider">Usuário</th>
                <th scope="col" class="px-6 py-4 text-left text-sm font-semibold text-white uppercase tracking-wider">Perfil</th>
                <th scope="col" class="px-6 py-4 text-left text-sm font-semibold text-white uppercase tracking-wider">E-mail</th>
                <th scope="col" class="px-6 py-4 text-left text-sm font-semibold text-white uppercase tracking-wider">Status</th>
                <th scope="col" class="px-6 py-4 text-left text-sm font-semibold text-white uppercase tracking-wider">Ações</th>
              </tr>
            </thead>
            <tbody id="tabelaUsuarios" class="bg-white divide-y divide-gray-200">
            </tbody>
          </table>
        </div>
      </div>

      <div id="statusMessage" class="mt-4 text-center text-gray-600"></div>

    </section>
  </main>

  <script>
    // APENAS PARA TESTAR AS FUNCIONALIDADES DE BUSCA E FILTRO
    const mockBackend = {
      _usuarios: [ // Dados que seriam armazenados em um banco de dados real
        // Adicionado um 'id' único para cada usuário, essencial para referenciar na edição
        { id: "USR-001", nome: "Dr. Vincent Vega", cargo: "Médico direcologista", status: "ativo", email: "vincentvega@gmail.com" },
        { id: "USR-002", nome: "Enf. Mia Wallace", cargo: "Enfermeira", status: "inativo", email: "Miawallace@gmail.com" },
        { id: "USR-003", nome: "Ag. Jules Winnfield", cargo: "Agente Comunitário", status: "ativo", email: "JulesWinnfield@gmail.com" },
        { id: "USR-004", nome: "Dr. Butch Coolidge", cargo: "Médico cardiologista", status: "ativo", email: "butch.coolidge@email.com" },
        { id: "USR-005", nome: "Enf. Marsellus Wallace", cargo: "Enfermeiro", status: "inativo", email: "marsellus.wallace@email.com" },
        { id: "USR-006", nome: "Ag. Fabienne Lemoine", cargo: "Agente Comunitário", status: "ativo", email: "fabienne.lemoine@email.com" }
      ],

      // Simula uma requisição GET para buscar todos os usuários
      getUsuarios: function() {
        return new Promise(resolve => {
          setTimeout(() => { // Simula um atraso de rede de 500ms
            resolve(JSON.parse(JSON.stringify(this._usuarios))); // Retorna uma cópia para evitar mutação direta
          }, 500);
        });
      }
    };
    // --- FIM DA SIMULAÇÃO DE BACKEND ---

    // Variável para armazenar a lista de usuários obtida do backend
    let usuariosAtuais = [];
    // Referência ao elemento de mensagem de status
    const statusMessage = document.getElementById("statusMessage");

    // Seleção de elementos HTML para filtros e tabela
    const buscaNome = document.getElementById("buscaNome");
    const filtroCargo = document.getElementById("filtroCargo");
    const filtroStatus = document.getElementById("filtroStatus");
    const tabela = document.getElementById("tabelaUsuarios");
    const btnNovoUsuario = document.getElementById("btnNovoUsuario"); // Seleção do botão "+ Novo Usuário"

    // Função assíncrona para carregar os usuários do "backend"
    async function carregarUsuarios() {
      statusMessage.textContent = "Carregando usuários..."; // Mensagem de carregamento
      try {
        // *** EM UM PROJETO REAL, AQUI VOCÊ USARIA 'fetch' ***
        // Exemplo:
        // const response = await fetch('/api/usuarios');
        // if (!response.ok) {
        //   throw new Error(`Erro HTTP: ${response.status}`);
        // }
        // usuariosAtuais = await response.json();

        // Usando o mockBackend para simular a requisição:
        usuariosAtuais = await mockBackend.getUsuarios();
        statusMessage.textContent = ""; // Limpa a mensagem de carregamento
        renderTabela(); // Renderiza a tabela com os dados atualizados
      } catch (error) {
        console.error("Erro ao carregar usuários:", error);
        statusMessage.textContent = `Erro ao carregar usuários: ${error.message}`; // Exibe erro
        // Mensagem de erro dentro da estrutura da tabela
        tabela.innerHTML = `<tr><td colspan="5" class="px-6 py-4 text-center text-red-500">Erro ao carregar usuários.</td></tr>`;
      }
    }

    // Função para redirecionar para a tela de edição de usuário
    function editarUsuario(usuarioId) {
      // Redireciona para uma URL de edição, passando o ID do usuário como parâmetro de query.
      window.location.href = `editar-usuario.html?id=${usuarioId}`;
    }

    // Função para redirecionar para a tela de criação de novo usuário
    function abrirNovoUsuario() {
      window.location.href = `novo-usuario.html`;
    }

    // Função para renderizar/atualizar a tabela de usuários
    function renderTabela() {
      // Obter valores dos filtros (sempre do frontend)
      const nomeBusca = buscaNome.value.toLowerCase().trim();
      const cargo = filtroCargo.value.toLowerCase();
      const status = filtroStatus.value;

      // Limpar o corpo da tabela antes de renderizar
      tabela.innerHTML = "";

      // Filtrar usuários com base nos critérios (a partir dos dados que já estão no frontend)
      const filtrados = usuariosAtuais.filter(usuario => {
        const nomeMatch = usuario.nome.toLowerCase().includes(nomeBusca);
        const cargoMatch = cargo === "todos" || usuario.cargo.toLowerCase().includes(cargo);
        const statusMatch = status === "todos" || usuario.status === status;
        return nomeMatch && cargoMatch && statusMatch;
      });

      // Exibir mensagem se nenhum usuário for encontrado
      if (filtrados.length === 0) {
        tabela.innerHTML = `
          <tr>
            <td colspan="5" class="px-6 py-6 text-center text-gray-500 text-lg font-semibold bg-gray-50">Nenhum usuário encontrado.</td>
          </tr>
        `;
        return;
      }

      // Criar e adicionar linhas de usuários filtrados na tabela
      filtrados.forEach((usuario, index) => { // Adicione 'index' aqui 
        const tr = document.createElement("tr");
        
        tr.className = `hover:bg-gray-100 ${index % 2 === 0 ? 'bg-white' : 'bg-gray-50'}`;

        // Preencher a linha com os dados do usuário e o botão de editar
        tr.innerHTML = `
          <td class="px-6 py-3 whitespace-nowrap font-medium text-gray-900">${usuario.nome}</td>
          <td class="px-6 py-3 whitespace-nowrap text-gray-700">${usuario.cargo}</td>
          <td class="px-6 py-3 text-gray-700 break-words max-w-xs">${usuario.email}</td>
          <td class="px-6 py-3 whitespace-nowrap">
            <span class="${usuario.status === "ativo" ? "text-green-600 font-semibold bg-green-100 px-2 py-0.5 rounded-full text-xs" : "text-red-600 font-semibold bg-red-100 px-2 py-0.5 rounded-full text-xs"}">
              ${usuario.status === "ativo" ? "Ativo" : "Inativo"}
            </span>
          </td>
          <td class="px-6 py-3 whitespace-nowrap text-right text-sm font-medium">
            <button onclick="editarUsuario('${usuario.id}')"
               class="text-indigo-600 hover:text-indigo-900 font-medium">
              Editar
            </button>
          </td>
        `;
        tabela.appendChild(tr);
      });
    }

    // Adicionar escutadores de eventos para os filtros e busca
    buscaNome.addEventListener("input", renderTabela);
    filtroCargo.addEventListener("change", renderTabela);
    filtroStatus.addEventListener("change", renderTabela);

    // Escutador para o botão "+ Novo Usuário"
    btnNovoUsuario.addEventListener("click", abrirNovoUsuario);

    // Carregar os usuários do "backend" quando a página é carregada
    carregarUsuarios();
  </script>

</body>
</html>
