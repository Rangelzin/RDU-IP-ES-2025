<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Página Inicial - Sistema de Rastreamento</title>
  <link href="../assets/css/output.css" rel="stylesheet" />
</head>
<body class="w-screen h-screen flex flex-col font-sans">

  <header class="flex items-center bg-[var(--color-secondary)] h-20 px-4">
    <img class="h-18 w-18 mr-4" src="../assets/img/Logo.svg" alt="Logo" />
    <h1 class="text-3xl font-sans text-[var(--color-fifth)]">Pesquisar Usuário</h1>
  </header>

  <main class="flex flex-1">

    <aside class="w-20 bg-[var(--color-secondary)]"></aside>

    <section class="flex-1 bg-gray-100 p-6 overflow-auto">

      <div class="flex flex-wrap items-center gap-4 mb-6">
        <select id="filtroStatus" class="bg-white border border-gray-300 text-sm rounded px-3 py-2">
          <option value="todos">Todos os Status</option>
          <option value="ativo">Ativo</option>
          <option value="inativo">Inativo</option>
        </select>

        <select id="filtroCargo" class="bg-white border border-gray-300 text-sm rounded px-3 py-2">
          <option value="todos">Todos os cargos</option>
          <option value="médico">Médico</option>
          <option value="enfermeiro">Enfermeiro</option>
          <option value="agente comunitário">Agente Comunitário</option>
        </select>

        <input type="text" id="buscaNome" placeholder="Buscar por nome..." class="bg-white border border-gray-300 text-sm rounded px-3 py-2 w-60" />

        <button id="btnNovoUsuario" class="bg-purple-600 hover:bg-purple-700 text-white px-5 py-2.5 rounded-lg text-sm font-semibold shadow-md ml-auto transition duration-300 ease-in-out transform hover:scale-105">
          + Novo Usuário
        </button>
      </div>

      <div class="bg-white rounded-md overflow-hidden shadow">
        <div class="overflow-x-auto">
          <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-800">
              <tr>
                <th scope="col" class="px-6 py-4 text-left text-sm font-semibold text-white uppercase tracking-wider">Usuário</th>
                <th scope="col" class="px-6 py-4 text-left text-sm font-semibold text-white uppercase tracking-wider">Perfil</th>
                <th scope="col" class="px-6 py-4 text-left text-sm font-semibold text-white uppercase tracking-wider">E-mail</th>
                <th scope="col" class="px-6 py-4 text-left text-sm font-semibold text-white uppercase tracking-wider">Status / Ações</th>
              </tr>
            </thead>
            <tbody id="tabelaUsuarios" class="bg-white divide-y divide-gray-200">
              </tbody>
          </table>
        </div>
      </div>

      <div id="statusMessage" class="mt-4 text-center text-gray-600"></div>

    </section>
  </main>

  <script>
    const usuarios = [
      { nome: "Dr. Vincent Vega", cargo: "Médico direcologista", status: "ativo", email: "vincentvega@gmail.com" },
      { nome: "Enf. Mia Wallace", cargo: "Enfermeira", status: "inativo", email: "Miawallace@gmail.com" },
      { nome: "Ag. Jules Winnfield", cargo: "Agente Comunitário", status: "ativo", email: "JulesWinnfield@gmail.com" },
      { nome: "Dr. Butch Coolidge", cargo: "Médico cardiologista", status: "ativo", email: "butch.coolidge@email.com" },
      { nome: "Enf. Marsellus Wallace", cargo: "Enfermeiro", status: "inativo", email: "marsellus.wallace@email.com" },
      { nome: "Ag. Fabienne Lemoine", cargo: "Agente Comunitário", status: "ativo", email: "fabienne.lemoine@email.com" }
    ];

    const buscaNome = document.getElementById("buscaNome");
    const filtroCargo = document.getElementById("filtroCargo");
    const filtroStatus = document.getElementById("filtroStatus");
    const tabela = document.getElementById("tabelaUsuarios");
    const btnNovoUsuario = document.getElementById("btnNovoUsuario"); // Referência ao novo botão

    function renderTabela() {
      const nomeBusca = buscaNome.value.toLowerCase().trim();
      const cargo = filtroCargo.value;
      const status = filtroStatus.value;

      tabela.innerHTML = ""; // Limpa o corpo da tabela

      const filtrados = usuarios.filter(usuario => {
        const nomeMatch = usuario.nome.toLowerCase().includes(nomeBusca);
        // Ajuste no filtro de cargo para lidar com "médico" e "médico cardiologista"
        const cargoMatch = cargo === "todos" || usuario.cargo.toLowerCase().includes(cargo.toLowerCase());
        const statusMatch = status === "todos" || usuario.status === status;
        return nomeMatch && cargoMatch && statusMatch;
      });

      if (filtrados.length === 0) {
        // Ajustado colspan para 4 (número de colunas no cabeçalho)
        tabela.innerHTML = `
          <tr>
            <td colspan="4" class="px-6 py-6 text-center text-gray-500 text-lg font-semibold bg-gray-50">Nenhum usuário encontrado.</td>
          </tr>
        `;
        return;
      }

      filtrados.forEach((usuario, index) => {
        const tr = document.createElement("tr");
        // Efeito zebra e hover
        tr.className = `hover:bg-gray-100 ${index % 2 === 0 ? 'bg-white' : 'bg-gray-50'}`;

        tr.innerHTML = `
          <td class="px-6 py-3 font-medium text-gray-900">${usuario.nome}</td>
          <td class="px-6 py-3 whitespace-nowrap text-gray-700">${usuario.cargo}</td>
          <td class="px-6 py-3 text-gray-700 break-words max-w-xs">${usuario.email}</td>
          <td class="px-6 py-3 whitespace-nowrap text-right text-sm font-medium">
            <span class="${usuario.status === "ativo" ? "text-green-600 font-bold" : "text-red-600 font-bold"} mr-2">
              ${usuario.status === "ativo" ? "Ativo" : "Inativo"}
            </span>
            <button onclick="editarUsuario('${usuario.email}')" class="text-indigo-600 hover:text-indigo-900 font-medium">Editar</button>
          </td>
        `;
        tabela.appendChild(tr);
      });
    }

    // Função para simular edição (pode ser um redirecionamento como no código 1)
    function editarUsuario(userEmail) {
      alert(`Função de edição para o usuário: ${userEmail}`);
      // window.location.href = `editar-usuario.html?email=${userEmail}`; // Exemplo de redirecionamento
    }

    // Função para simular a abertura de novo usuário
    function abrirNovoUsuario() {
        alert("Redirecionar para tela de novo usuário.");
        // window.location.href = `novo-usuario.html`; // Exemplo de redirecionamento
    }

    // Event Listeners
    buscaNome.addEventListener("input", renderTabela);
    filtroCargo.addEventListener("change", renderTabela);
    filtroStatus.addEventListener("change", renderTabela);
    btnNovoUsuario.addEventListener("click", abrirNovoUsuario); // Adicionando evento ao novo botão

    // Carrega a tabela na inicialização
    renderTabela();
  </script>

</body>
</html>
