<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratório - Exame Citopatológico</title>
    <link rel="stylesheet" href="/assets/css/lab.css">
    <script src="/src/components/main-exame-frame.js" type="module"></script>
    <script src="/src/components/siderbar-left.js" type="module"></script>
    <link rel="stylesheet" href="/assets/css/output.css">
</head>
<body>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100%;
            /* overflow: hidden; */
            display: flex ;
        }
    </style>
    <sidebar-left></sidebar-left>
    <exam-layout>
            <div slot="content">
               <div class="exm-page">
    <form action="" method="post">
        <div class="box-div">
            <h2 class="box-div-title">IDENTIFICAÇÃO DO LABORATÓRIO</h2>
        </div>
        
        <fieldset class="fieldset-identificacao-lab">
            <div class="two-column-layout-lab"> 
                <div class="column-left-lab">
                    <div class="ln">
                        <div class="input-laboratorio-cnes">
                            <label for="laboratorio-cnes">CNES do Laboratório</label>
                            <input autocomplete="off" name="laboratorio_cnes" id="laboratorio-cnes" type="text" maxlength="14">
                        </div>
                    </div>
                    <div class="ln">
                        <div class="input-laboratorio-nome">
                            <label for="laboratorio-nome">Nome do Laboratório</label>
                            <input autocomplete="off" name="laboratorio_nome" id="laboratorio-nome" type="text" maxlength="21">
                        </div>
                    </div>
                </div><div class="column-right-lab">
                    <div class="ln">
                        <div class="input-numero-exame">
                            <label for="numero-exame">Número do Exame</label>
                            <input autocomplete="off" name="numero_exame" id="numero-exame" type="text" maxlength="16">
                        </div>
                    </div>
                    <div class="ln">
                        <div class="input-recebido-em">
                            <label for="recebido-em-dia">Recebido em:</label>
                            <div class="date-inputs">
                                <input autocomplete="off" name="recebido_em_dia" id="recebido-em-dia" type="text" maxlength="2" placeholder="DD">
                                <span class="date-separator">/</span>
                                <input autocomplete="off" name="recebido_em_mes" id="recebido-em-mes" type="text" maxlength="2" placeholder="MM">
                                <span class="date-separator">/</span>
                                <input autocomplete="off" name="recebido_em_ano" id="recebido-em-ano" type="text" maxlength="4" placeholder="AAAA">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </fieldset>
     </form>
</div>
            </div>
    </exam-layout>
</body>
</html>
